name: Bug report
description: A failed run, wrong data, or tooling defect
title: "Bug: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to runs, logs, data samples. No personal data - this is a public repo.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
    validations:
      required: false
  - type: textarea
    id: fix
    attributes:
      label: Suspected fix
    validations:
      required: false
  - type: textarea
    id: regression
    attributes:
      label: Regression test (required before closing)
      description: Link the fixing PR and named automated regression test. If infeasible, link a separate test issue and explain why.
      placeholder: Fixing PR + test path/name, or test issue + reason
    validations:
      required: false
