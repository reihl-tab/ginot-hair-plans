name: Ingest Go parcel analysis
run-name: Ingest parcel analysis
on:
  workflow_dispatch:
    inputs:
      report:
        description: Bounded source-verified audit result
        required: true
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: parcel-audit-result
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate exact source snapshot and report
        env:
          REPORT: ${{ inputs.report }}
        run: |
          printf '%s' "$REPORT" > /tmp/audit-report.json
          python3 scripts/audit/ingest.py --report /tmp/audit-report.json
          python3 scripts/build_site_index.py
      - name: Publish through tested PR only
        env:
          GH_TOKEN: ${{ secrets.REFRESH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/parcel_audit.json docs/parcel-audit.json docs/index.json && [ -z "$(git ls-files --others --exclude-standard data/parcel_audit.json docs/parcel-audit.json)" ]; then exit 0; fi
          BRANCH="parcel-audit/${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add data/parcel_audit.json docs/parcel-audit.json docs/index.json docs/badge/parcel-*.json
          git commit -m 'data: verified Go parcel audit result'
          git push origin "$BRANCH"
          PR=$(gh pr create --title 'Verified Go parcel audit result' --body 'Source/digest/cursor verified; callback does not start a scan.' --base main --head "$BRANCH")
          # Wait for PR event checks to register before asking --watch.
          for i in $(seq 1 30); do
            COUNT=$(gh pr view "$PR" --json statusCheckRollup --jq '.statusCheckRollup | length')
            [ "$COUNT" -gt 0 ] && break
            [ "$i" = 30 ] && exit 1
            sleep 5
          done
          gh pr checks "$PR" --watch --interval 10
          gh pr update-branch "$PR" || true
          # Poll budget: update-branch restarts pull_request CI, which took
          # ~10 min under runner queue load in run 39900080019 and missed the
          # old 45-poll budget by 10s. 90 polls (~20 min) gives >2x headroom (#380).
          for i in $(seq 1 90); do
            STATE=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
            [ "$STATE" = CLEAN ] && break
            [ "$STATE" = DIRTY ] && exit 1
            # Main requires 1 approving review the bot cannot give: when BLOCKED
            # and every check is green, merge with the owner token's admin bypass.
            if [ "$STATE" = BLOCKED ]; then
              BAD=$(gh pr checks "$PR" 2>&1 | cut -f2 | grep -c -E "pending|fail|queued" || true)
              [ "$BAD" = "0" ] && break
            fi
            [ "$i" = 90 ] && { echo "timed out waiting for a mergeable state ($STATE)"; gh pr checks "$PR" || true; exit 1; }
            sleep 10
          done
          gh pr merge "$PR" --squash --admin --delete-branch
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
      - name: Result summary
        if: always()
        run: |
          echo '## Go parcel analysis callback' >> "$GITHUB_STEP_SUMMARY"
          echo 'A callback only validates/publishes audit JSON. It never dispatches a scan.' >> "$GITHUB_STEP_SUMMARY"
