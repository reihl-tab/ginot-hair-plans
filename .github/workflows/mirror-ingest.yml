name: Permit mirror ingest (over.org.il)

# Issue #74: bulk ingest of Jerusalem licensing case files from the
# over.org.il (גרסאות לעם) public mirror of the ykpubdata viewer -
# change detection and bulk layer with zero load on the municipality.
# The mirror's בעלי עניין personal-names column is dropped on ingest.
# MANUAL DISPATCH ONLY until a green manual run and owner sign-off,
# per the owner's schedule gate. The mirror carries no s.149
# publication dates; those stay with the direct scanner (permit-feed).

on:
  schedule:
    - cron: "20 3 * * *"   # nightly 03:20 UTC mirror-diff (owner-approved 2026-10-20)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

concurrency:
  group: mirror-ingest
  cancel-in-progress: false

jobs:
  mirror-ingest:
    if: ${{ vars.MIRROR_INGEST_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Ingest mirror rows and validate against the direct scan
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/mirror_ingest.py --validate-against data/permit_requests.json

      - name: Publish changes as a PR, merge on green CI, rebuild Pages
        env:
          GH_TOKEN: ${{ secrets.REFRESH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "no mirror changes"
            exit 0
          fi
          BRANCH="mirror-ingest/$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m mirror-output
          git fetch origin main
          git reset --hard origin/main
          if ! git stash pop; then
            git checkout --theirs .
            git add -A
            git stash drop
          fi
          git checkout -b "$BRANCH"
          python3 scripts/build_site_index.py || echo "site index rebuild failed (non-fatal)"
          git add data/ docs/index.json
          git commit -m "Permit mirror ingest $(date +%Y-%m-%d) (refs #74)

          Bulk ingest from the over.org.il public mirror of the ykpubdata
          licensing viewer, DRAFT-labelled; בעלי עניין personal data
          dropped on ingest. Third-party data - verify at source."
          git push -u origin "$BRANCH"
          PR=$(gh pr create --title "Permit mirror ingest $(date +%Y-%m-%d)" \
            --body "Automated mirror ingest (refs #74). DRAFT third-party mirror data; personal-names column dropped. Merged automatically once CI is green." \
            --base main --head "$BRANCH")
          echo "opened $PR"
          gh workflow run ci.yml --ref "$BRANCH"
          sleep 15
          # Bot-authored PRs get an approval-gated pull_request CI run
          # (conclusion action_required). Approve those first so the watch
          # below never dies on the approval gate (fixes #85).
          for ID in $(gh run list --workflow ci.yml --branch "$BRANCH" --limit 5 --json databaseId,conclusion -q '.[] | select(.conclusion=="action_required") | .databaseId'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$ID/approve" >/dev/null || true
          done
          RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RUN_ID" --exit-status --interval 20
          # main can move while CI runs (like #170): update the branch and
          # wait for a mergeable state before merging.
          gh pr update-branch "$PR" || true
          for i in $(seq 1 45); do
            STATE=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
            echo "merge state: $STATE"
            [ "$STATE" = "CLEAN" ] && break
            # Main requires 1 approving review, which the bot cannot give: when
            # BLOCKED and every check is green, merge with the owner token's
            # admin bypass (human PRs keep the review rule).
            if [ "$STATE" = "BLOCKED" ]; then
              BAD=$(gh pr checks "$PR" 2>&1 | cut -f2 | grep -c -E "pending|fail|queued" || true)
              [ "$BAD" = "0" ] && break
            fi
            [ "$STATE" = "DIRTY" ] && { echo "PR has conflicts"; exit 1; }
            [ "$i" = "45" ] && { echo "timed out waiting for a mergeable state ($STATE)"; exit 1; }
            sleep 10
          done
          gh pr merge "$PR" --squash --admin --delete-branch
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request failed (non-fatal)"

      - name: Dispatch targeted publication-date enrichment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run permit-feed.yml -f mode=enrich
          echo "dispatched permit-feed enrich (no-ops when the diff is empty)"
