name: Weekly data refresh (iplan + land.gov.il)

# Fully automatic weekly refresh, no VPN and no agent trigger (issue #55):
#   1. scripts/land_feed.py - Israel Land Authority TabaSearch public API:
#      per-plan deposit-publication status + status date (the statutory
#      objection-clock start) for every plan in the table.
#   2. refresh.py - the iplan ArcGIS refresh; merges the land feed into
#      each row (deadline = latest publication + 60d, Planning and
#      Building Law s.102), rebuilds CSV/XLSX/snapshots and the Pages site.
# Changes land as a PR, the CI checks run inline in the publish step
# (a bot-dispatched ci.yml run is approval-gated and the run's own token
# cannot approve it on scheduled triggers - issue #132), the PR is
# squash-merged on green, and a Pages build is requested via the API
# (GITHUB_TOKEN pushes do not trigger the Pages deploy-from-branch build).

on:
  schedule:
    - cron: "7 4 * * 2"   # Tuesdays 04:07 UTC (off-peak, weekly)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

jobs:
  refresh:
    if: ${{ vars.WEEKLY_REFRESH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch land.gov.il deposit-publication status per plan
        run: python3 -u scripts/land_feed.py

      - name: Run iplan refresh and render the site
        run: python3 -u refresh.py

      - name: Publish changes as a PR, merge on green CI, rebuild Pages
        env:
          # PAT (owner-approved 2026-10-21, repo secret): a GITHUB_TOKEN-opened
          # PR never triggers ci.yml, so the required checks never ran and the
          # auto-merge stalled. Opening/updating/merging as the PAT user fires
          # pull_request events normally.
          GH_TOKEN: ${{ secrets.REFRESH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "no changes this week"
            exit 0
          fi
          BRANCH="weekly-refresh/$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m feed-output
          git fetch origin main
          git reset --hard origin/main
          if ! git stash pop; then
            git checkout --theirs .
            git add -A
            git stash drop
          fi
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Weekly data refresh $(date +%Y-%m-%d) (refs #55)

          Automated weekly run: land.gov.il TabaSearch deposit-publication
          status feed + iplan refresh. Objection deadlines derived as
          latest publication + 60 days (s.102), sources kept per row."
          git push -u origin "$BRANCH"
          PR=$(gh pr create --title "Weekly data refresh $(date +%Y-%m-%d)" \
            --body "Automated weekly refresh (refs #55): land.gov.il publication-status feed + iplan refresh. Merged automatically once CI is green." \
            --base main --head "$BRANCH")
          echo "opened $PR"
          # CI runs inline in this job (fixes #132): a ci.yml run dispatched
          # from a scheduled workflow is approval-gated, and the run's own
          # GITHUB_TOKEN cannot approve it, so the old dispatch+watch step
          # died with "already completed with action_required" on scheduled
          # runs. Same commands as ci.yml, run here on the branch worktree.
          pip install -q ruff pytest
          ruff check src tests refresh.py
          python -m pytest -q
          # main can move during the long fetch (issue #170): bring the PR up
          # to date and wait for the ruleset to go green before merging.
          gh pr update-branch "$PR" || true
          # Poll budget: update-branch restarts pull_request CI, which took
          # ~10 min under runner queue load in run 39900080019 and missed the
          # old 45-poll budget by 10s. 90 polls (~20 min) gives >2x headroom (#380).
          for i in $(seq 1 90); do
            STATE=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
            echo "merge state: $STATE"
            [ "$STATE" = "CLEAN" ] && break
            # Main requires 1 approving review, which the bot cannot give: when
            # BLOCKED and every check is green, merge with the owner token's
            # admin bypass (human PRs keep the review rule).
            if [ "$STATE" = "BLOCKED" ]; then
              BAD=$(gh pr checks "$PR" 2>&1 | cut -f2 | grep -c -E "pending|fail|queued" || true)
              [ "$BAD" = "0" ] && break
            fi
            [ "$STATE" = "DIRTY" ] && { echo "PR has conflicts"; exit 1; }
            [ "$i" = "90" ] && { echo "timed out waiting for a mergeable state ($STATE)"; gh pr checks "$PR" || true; exit 1; }
            sleep 10
          done
          gh pr merge "$PR" --squash --admin --delete-branch
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request failed (non-fatal)"
          # Cloudflare Pages mirror (owner request 2026-10-21, quota-limited):
          # the mirror's production branch is `mirror`, so Pages builds ONLY
          # when this refresh (or a manual run of this workflow) lands - not
          # on every push to main. PR previews are disabled in the project.
          git fetch origin main
          git fetch origin mirror  # refresh the lease ref or the push is rejected (stale info)
          git push origin origin/main:refs/heads/mirror --force-with-lease
