name: Jerusalem permit feed pilot (VPN)

# Pilot for issue #57: scan a bounded batch of council parcels
# against the municipality's public permit API through the owner-operated
# L2TP tunnel, capture search-level request data plus the s.149
# publication process steps, write data/permit_requests.json, and land it
# as a PR (CI dispatched on the branch, squash merge on green, Pages
# rebuild via the API). MANUAL DISPATCH ONLY - the weekly cron stays
# commented until a green manual run, per the owner's gate. On any
# anti-bot challenge the run stops red (no workaround).
#
# Backfill schedule ENABLED 2026-10-19 (owner approval): one 500-parcel
# batch nightly at 03:00 UTC until all parcels are covered, then the job
# prints "backfill complete" and no-ops until the cron is switched to the
# approved weekly rotating re-scan (follow-up PR). Offset advances from
# the batch cursor in data/permit_requests.json; manual dispatch with
# explicit limit/offset always overrides.

on:
  schedule:
    - cron: "0 3 * * *"   # nightly 03:00 UTC backfill batch
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = parcel batch scan; enrich = publication dates for mirror-diff tiks"
        required: true
        default: "scan"
      include_unenriched:
        description: "enrich mode: also fetch never-enriched active tiks (one-time backfill)"
        required: false
        default: "false"
      limit:
        description: "Parcels to scan in this batch (scan) or tiks to enrich (enrich)"
        required: true
        default: "60"
      offset:
        description: "Parcel list offset"
        required: true
        default: "0"

concurrency:
  # One permit-feed run at a time: a scheduled fire while a long
  # backfill batch is still scanning waits in the queue instead of
  # duplicating the same cursor range and racing the publish step.
  # Offset is resolved at run start, so a queued run picks up the
  # cursor advanced by the run it waited for.
  group: permit-feed
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

jobs:
  permit-feed:
    if: ${{ vars.PERMIT_FEED_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install VPN transport packages
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y strongswan xl2tpd ppp curl > /dev/null 2>&1

      - name: Bring up owner-operated L2TP/IPsec tunnel
        env:
          VPN_L2TP_SERVER: ${{ secrets.VPN_L2TP_SERVER }}
          VPN_L2TP_PSK: ${{ secrets.VPN_L2TP_PSK }}
          VPN_L2TP_USERNAME: ${{ secrets.VPN_L2TP_USERNAME }}
          VPN_L2TP_PASSWORD: ${{ secrets.VPN_L2TP_PASSWORD }}
        run: sudo --preserve-env=VPN_L2TP_SERVER,VPN_L2TP_PSK,VPN_L2TP_USERNAME,VPN_L2TP_PASSWORD python3 scripts/vpn/l2tp.py up

      - name: Resolve batch parameters (schedule -> next offset)
        if: ${{ inputs.mode != 'enrich' }}
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            echo "LIMIT=${{ inputs.limit }}" >> "$GITHUB_ENV"
            echo "OFFSET=${{ inputs.offset }}" >> "$GITHUB_ENV"
          else
            read O _ < <(python3 -c "import json;b=json.load(open('data/permit_requests.json'))['batch'];print(b['offset']+b['limit'],b['limit'])")
            L=500   # approved backfill batch size for scheduled runs
            TOTAL=$(python3 -c "import json;print(len({(int(f['properties']['gush']),int(f['properties']['helka'])) for f in json.load(open('data/ginot_hair_parcels.geojson'))['features'] if f.get('properties',{}).get('gush') and f.get('properties',{}).get('helka')}))")
            if [ "$O" -ge "$TOTAL" ]; then
              echo "backfill complete: $O >= $TOTAL parcels; no-op until weekly re-scan is enabled"
              echo "BACKFILL_COMPLETE=true" >> "$GITHUB_ENV"
            fi
            echo "LIMIT=$L" >> "$GITHUB_ENV"
            echo "OFFSET=$O" >> "$GITHUB_ENV"
            echo "batch: offset=$O limit=$L of $TOTAL parcels"
          fi

      - name: Scan parcel batch for permit requests
        if: ${{ inputs.mode != 'enrich' && env.BACKFILL_COMPLETE != 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
        run: sudo -E python3 scripts/vpn/permit_feed.py --limit "${{ env.LIMIT }}" --offset "${{ env.OFFSET }}"

      - name: Enrich mirror tiks with s.149 publication dates
        if: ${{ inputs.mode == 'enrich' }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS="--limit ${{ inputs.limit }} --offset ${{ inputs.offset }}"
          if [ "${{ inputs.include_unenriched }}" = "true" ]; then ARGS="$ARGS --include-unenriched"; fi
          sudo -E python3 scripts/vpn/permit_enrich.py $ARGS

      - name: Publish changes as a PR, merge on green CI, rebuild Pages
        if: ${{ (inputs.mode == 'enrich' || env.BACKFILL_COMPLETE != 'true') && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet data/; then
            echo "no changes to permit data"
            exit 0
          fi
          BRANCH="permit-feed/$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m feed-output -- data/
          git fetch origin main
          git reset --hard origin/main
          if ! git stash pop; then
            git checkout --theirs .
            git add -A
            git stash drop
          fi
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "Permit feed batch $(date +%Y-%m-%d) (refs #57)"
          git push -u origin "$BRANCH"
          PR=$(gh pr create --title "Permit feed batch $(date +%Y-%m-%d)" \
            --body "Automated permit-feed pilot batch (refs #57). Merged automatically once CI is green." \
            --base main --head "$BRANCH")
          echo "opened $PR"
          gh workflow run ci.yml --ref "$BRANCH"
          sleep 15
          RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RUN_ID" --exit-status --interval 20
          gh pr merge "$PR" --squash --delete-branch
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request failed (non-fatal)"

      - name: Tear down tunnel and remove generated secret material
        if: always()
        run: sudo python3 scripts/vpn/l2tp.py down
