name: Jerusalem permit feed pilot (VPN)

# Public municipality API, owner-operated tunnel. Three-second request
# spacing, serial execution, stop on challenge. No increased concurrency.
# Backfill:280 parcels every6h (03/09/15/21 UTC), until cursor reaches
# all4739 parcels. Resolve cursor at execution time; checkpoints survive
# runner loss. A larger batch previously exceeded the355-minute timeout.
# Oct22 approval: four daily windows, unchanged request spacing.

on:
  # Backfill request by code (issue #102): editing data/backfill_request.json
  # on main starts one run with the inputs stored in that file. No file
  # change, no run. The file is not cleared; a new request is a new edit.
  push:
    branches: [main]
    paths:
      - data/backfill_request.json
  schedule:
    - cron: "0 3 * * *"   # daily backfill batch 1, 03:00 UTC (06:00 Israel)
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = parcel batch scan; enrich = publication dates for mirror-diff tiks; recheck = re-scan active (or rotation) parcels only"
        required: true
        default: "scan"
      include_unenriched:
        description: "enrich mode: also fetch never-enriched active tiks (one-time backfill)"
        required: false
        default: "false"
      include_late_stages:
        description: "enrich backfill: also fetch late-stage statuses (draft permit, pink file, deposit paid, city engineer approved, shelved); default false"
        required: false
        default: "false"
      limit:
        description: "Parcels to scan in this batch (scan) or tiks to enrich (enrich)"
        required: true
        default: "60"
      recheck_tier:
        description: "recheck mode: active = parcels with changeable requests; rotation = oldest-checked other parcels (limit = cap)"
        required: false
        default: "active"
      offset:
        description: "Parcel list offset"
        required: true
        default: "0"

concurrency:
  # One permit-feed run at a time: a scheduled fire while a long
  # backfill batch is still scanning waits in the queue instead of
  # duplicating the same cursor range and racing the publish step.
  # Offset is resolved at run start, so a queued run picks up the
  # cursor advanced by the run it waited for.
  group: permit-feed
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

jobs:
  permit-feed:
    if: ${{ vars.PERMIT_FEED_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve run inputs (dispatch inputs, or data/backfill_request.json on push)
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          ev = os.environ["GITHUB_EVENT_NAME"]
          if ev == "push":
              d = json.load(open("data/backfill_request.json"))
              src = {k: str(d.get(k, "")).lower() if isinstance(d.get(k), bool) else str(d.get(k, ""))
                     for k in ("mode", "include_unenriched", "include_late_stages", "limit", "offset", "recheck_tier")}
          elif ev == "workflow_dispatch":
              ins = json.loads(os.environ["INPUTS_JSON"])
              src = {k: str(ins.get(k) or "") for k in ("mode", "include_unenriched", "include_late_stages", "limit", "offset", "recheck_tier")}
          else:
              src = {k: "" for k in ("mode", "include_unenriched", "include_late_stages", "limit", "offset", "recheck_tier")}
          for k, v in src.items():
              assert "\n" not in v and len(v) < 20, k
              print(f"REQ_{k.upper()}={v}")
          PY
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}

      - name: Install VPN transport packages
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y strongswan xl2tpd ppp curl > /dev/null 2>&1

      - name: Bring up owner-operated L2TP/IPsec tunnel
        env:
          VPN_L2TP_SERVER: ${{ secrets.VPN_L2TP_SERVER }}
          VPN_L2TP_PSK: ${{ secrets.VPN_L2TP_PSK }}
          VPN_L2TP_USERNAME: ${{ secrets.VPN_L2TP_USERNAME }}
          VPN_L2TP_PASSWORD: ${{ secrets.VPN_L2TP_PASSWORD }}
        run: sudo --preserve-env=VPN_L2TP_SERVER,VPN_L2TP_PSK,VPN_L2TP_USERNAME,VPN_L2TP_PASSWORD python3 scripts/vpn/l2tp.py up

      - name: Resolve batch parameters (schedule -> next offset)
        if: ${{ env.REQ_MODE != 'enrich' && env.REQ_MODE != 'recheck' }}
        run: |
          if [ -n "${{ env.REQ_LIMIT }}" ]; then
            echo "LIMIT=${{ env.REQ_LIMIT }}" >> "$GITHUB_ENV"
            echo "OFFSET=${{ env.REQ_OFFSET }}" >> "$GITHUB_ENV"
          else
            read O _ < <(python3 -c "import json;b=json.load(open('data/permit_requests.json'))['batch'];print(b['offset']+b['limit'],b['limit'])")
            L=280   # approved backfill batch size for scheduled runs (280 fits the 355-min job timeout at the measured ~60-90 parcels/hour; 500 did not)
            TOTAL=$(python3 -c "import json;print(len({(int(f['properties']['gush']),int(f['properties']['helka'])) for f in json.load(open('data/ginot_hair_parcels.geojson'))['features'] if f.get('properties',{}).get('gush') and f.get('properties',{}).get('helka')}))")
            if [ "$O" -ge "$TOTAL" ]; then
              echo "backfill complete: $O >= $TOTAL parcels; no-op until weekly re-scan is enabled"
              echo "BACKFILL_COMPLETE=true" >> "$GITHUB_ENV"
            fi
            echo "LIMIT=$L" >> "$GITHUB_ENV"
            echo "OFFSET=$O" >> "$GITHUB_ENV"
            echo "batch: offset=$O limit=$L of $TOTAL parcels"
          fi

      - name: Scan parcel batch for permit requests
        if: ${{ env.REQ_MODE != 'enrich' && env.REQ_MODE != 'recheck' && env.BACKFILL_COMPLETE != 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Redacted VPN health watcher (issue #83): masked, timestamped
          # tunnel/IKE/rekey/DPD state to the run log every 30s, so a
          # server-side kill is visible even when the run is cancelled.
          sudo python3 scripts/vpn/vpn_watch.py &
          WATCH=$!
          trap 'sudo kill $WATCH 2>/dev/null || true' EXIT
          # --checkpoint pushes partial results to the scan-checkpoint branch
          # every 15 parcels and --resume continues from it (issue #155), so a
          # lost runner no longer wipes hours of scanning. GH_TOKEN is needed
          # by the checkpoint push; sudo -E preserves it.
          sudo -E python3 scripts/vpn/permit_feed.py --limit "${{ env.LIMIT }}" --offset "${{ env.OFFSET }}" --checkpoint --resume

      - name: Re-check active (or rotation) parcels only (tiered re-check, issue #346)
        if: ${{ env.REQ_MODE == 'recheck' }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          TIER="${{ env.REQ_RECHECK_TIER }}"
          case "$TIER" in active|rotation) ;; *) TIER=active ;; esac
          CAP="${{ env.REQ_LIMIT }}"; CAP="${CAP:-150}"
          python3 scripts/vpn/recheck_select.py --tier "$TIER" --cap "$CAP" > /tmp/recheck_parcels.json
          python3 -c "import json;print(len(json.load(open('/tmp/recheck_parcels.json'))),'parcels in tier')"
          sudo python3 scripts/vpn/vpn_watch.py &
          WATCH=$!
          trap 'sudo kill $WATCH 2>/dev/null || true' EXIT
          # list mode never reads or writes the scan-checkpoint branch
          sudo -E python3 scripts/vpn/permit_feed.py --parcel-list /tmp/recheck_parcels.json

      - name: Enrich mirror tiks with s.149 publication dates
        if: ${{ env.REQ_MODE == 'enrich' }}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Redacted VPN health watcher (issue #83): masked, timestamped
          # tunnel/IKE/rekey/DPD state to the run log every 30s, so a
          # server-side kill is visible even when the run is cancelled.
          sudo python3 scripts/vpn/vpn_watch.py &
          WATCH=$!
          trap 'sudo kill $WATCH 2>/dev/null || true' EXIT
          ARGS="--limit ${{ env.REQ_LIMIT }} --offset ${{ env.REQ_OFFSET }}"
          if [ "${{ env.REQ_INCLUDE_UNENRICHED }}" = "true" ]; then ARGS="$ARGS --include-unenriched"; fi
          if [ "${{ env.REQ_INCLUDE_LATE_STAGES }}" = "true" ]; then ARGS="$ARGS --include-late-stages"; fi
          sudo -E python3 scripts/vpn/permit_enrich.py $ARGS

      - name: Publish changes as a PR, merge on green CI, rebuild Pages
        if: ${{ (env.REQ_MODE == 'enrich' || env.BACKFILL_COMPLETE != 'true') && success() }}
        env:
          GH_TOKEN: ${{ secrets.REFRESH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet data/; then
            echo "no changes to permit data"
            exit 0
          fi
          BRANCH="permit-feed/$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m feed-output -- data/
          git fetch origin main
          git reset --hard origin/main
          if ! git stash pop; then
            git checkout --theirs .
            git add -A
            git stash drop
          fi
          git checkout -b "$BRANCH"
          python3 scripts/build_site_index.py || echo "site index rebuild failed (non-fatal)"
          git add data/ docs/index.json docs/badge/parcel-*.json
          git commit -m "Permit feed batch $(date +%Y-%m-%d) (refs #57)"
          git push -u origin "$BRANCH"
          PR=$(gh pr create --title "Permit feed batch $(date +%Y-%m-%d)" \
            --body "Automated permit-feed pilot batch (refs #57). Merged automatically once CI is green." \
            --base main --head "$BRANCH")
          echo "opened $PR"
          gh workflow run ci.yml --ref "$BRANCH"
          sleep 15
          # Bot-authored PRs get an approval-gated pull_request CI run
          # (conclusion action_required). Approve those first so the watch
          # below never dies on the approval gate (fixes #85).
          for ID in $(gh run list --workflow ci.yml --branch "$BRANCH" --limit 5 --json databaseId,conclusion -q '.[] | select(.conclusion=="action_required") | .databaseId'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$ID/approve" >/dev/null || true
          done
          RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RUN_ID" --exit-status --interval 20
          # main can move during the long scan (like #170): update the branch
          # and wait for a mergeable state before merging.
          gh pr update-branch "$PR" || true
          for i in $(seq 1 45); do
            STATE=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
            echo "merge state: $STATE"
            [ "$STATE" = "CLEAN" ] && break
            [ "$STATE" = "DIRTY" ] && { echo "PR has conflicts"; exit 1; }
            [ "$i" = "45" ] && { echo "timed out waiting for a mergeable state ($STATE)"; exit 1; }
            sleep 10
          done
          gh pr merge "$PR" --squash --delete-branch
          # Batch fully published - drop the mid-run checkpoint branch (#155)
          # A recheck must leave the backfill's checkpoint alone.
          if [ "${{ env.REQ_MODE }}" != "recheck" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/scan-checkpoint" || true
          fi
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request failed (non-fatal)"

      - name: Dispatch read-only Go auditor after scan publication
        if: ${{ success() && env.REQ_MODE != 'enrich' && env.REQ_MODE != 'recheck' && env.BACKFILL_COMPLETE != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PARCEL_AUDIT_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          gh workflow run audit.yml --repo reihlinstinct/parcel-coverage-audit --ref main -f source_sha="$SHA" -f source_run="$GITHUB_RUN_ID"

      - name: Self-dispatch next enrichment run while unenriched tiks remain
        # Issue #145: an enrich backfill run (mode=enrich,
        # include_unenriched=true) that ends green starts its own successor
        # via workflow_dispatch - exempt from the GITHUB_TOKEN no-recursion
        # rule - until no unenriched early-stage tiks remain. Hard stops:
        # any failed step (this step is skipped), anti-bot marker (enrich
        # exits 2 -> run red), VPN failure (run red), or the daily run cap
        # (10 permit-feed runs per UTC day) -> stop and file an issue for a
        # human instead of dispatching.
        if: ${{ success() && env.REQ_MODE == 'enrich' && env.REQ_INCLUDE_UNENRICHED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ env.REQ_INCLUDE_LATE_STAGES }}" = "true" ]; then ARGS="--include-late-stages"; fi
          REMAINING=$(python3 scripts/vpn/permit_enrich.py --count-only --include-unenriched $ARGS | tail -1)
          echo "unenriched tiks remaining: $REMAINING"
          if [ "$REMAINING" -eq 0 ]; then
            echo "enrichment backfill complete - chain ends"
            gh issue comment 99 --body "Self-chained enrichment backfill complete ($(date -u +%F)): 0 unenriched early-stage tiks remain (refs #145)." || true
            exit 0
          fi
          TODAY=$(date -u +%F)
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/permit-feed.yml/runs?created=%3E%3D${TODAY}&per_page=100" --jq '.total_count')
          echo "permit-feed runs today: $RUNS (cap 10)"
          if [ "$RUNS" -ge 10 ]; then
            echo "daily chain cap reached - stopping for a human"
            if ! gh issue list --search "enrichment chain paused" --state open --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "Enrichment chain paused: daily run cap reached"                 --body "Self-chaining enrichment stopped after 10 permit-feed runs in one UTC day (guard, refs #145). $REMAINING unenriched tiks remain. Restart: dispatch permit-feed.yml with mode=enrich, include_unenriched=true."                 --label needs-triage
            fi
            exit 0
          fi
          gh workflow run permit-feed.yml -f mode=enrich -f include_unenriched=true             -f include_late_stages="${{ env.REQ_INCLUDE_LATE_STAGES }}"             -f limit="${{ env.REQ_LIMIT }}" -f offset=0
          echo "dispatched next enrichment run ($REMAINING tiks remaining)"

      - name: Tear down tunnel and remove generated secret material
        if: always()
        run: sudo python3 scripts/vpn/l2tp.py down
