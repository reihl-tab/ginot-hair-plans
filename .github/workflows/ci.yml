name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff pytest-cov
      - run: ruff check src tests refresh.py
      - run: python -m pytest -q --cov --cov-config=.coveragerc --cov-report=term --cov-report=json:coverage.json --junitxml=test-results.xml
      - name: Test run summary
        if: ${{ always() }}
        run: python scripts/ci/test_summary.py --junit test-results.xml --coverage coverage.json --title "Python ${{ matrix.python-version }}"
      - name: Publish measured main-only test badges
        if: ${{ success() && github.ref == 'refs/heads/main' && matrix.python-version == '3.12' }}
        run: |
          python3 scripts/ci/publish_badges.py python test-results.xml coverage.json /tmp/badges
          bash scripts/ci/push_badges.sh /tmp/badges
      # Coverage gate (issue #105). Report-only until .github/qa-gates.json
      # has "enforce": true - flipping that one value is the whole
      # November switch-on. The floor can only be raised.
      - name: Coverage gate
        run: |
          python3 - <<'PY'
          import json, sys
          gates = json.load(open(".github/qa-gates.json"))
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          floor = gates["coverage_floor"]
          print(f"coverage {pct:.1f}% (floor {floor}%, enforce={gates['enforce']})")
          if pct < floor:
              msg = f"coverage {pct:.1f}% is below the floor {floor}%"
              if gates["enforce"]:
                  sys.exit(msg)
              print("::warning::" + msg + " (report-only, gate not enforced yet)")
          PY
  worker:
    # Node tests for the Cloudflare API worker (worker/). Ubuntu ships Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test --test-reporter=junit --test-reporter-destination=worker-results.xml worker/*.test.mjs
      - name: Test run summary
        if: ${{ always() }}
        run: python3 scripts/ci/test_summary.py --junit worker-results.xml --title "Worker tests"

  site-browser:
    # Headless Chromium tests of the built site (issue #106). Separate job so the
    # 4-version test matrix does not each download a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_site_browser.py tests/test_map_browser.py --junitxml=browser-results.xml
      - name: Test run summary
        if: ${{ always() }}
        run: python scripts/ci/test_summary.py --junit browser-results.xml --title "Browser tests"
