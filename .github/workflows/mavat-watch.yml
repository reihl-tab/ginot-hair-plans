name: Mavat watch (VPN)

# Weekly Mavat document-set check for the tracked deposit-stage plans
# (data/mavat_tracked_plans.json, issue #32), through the owner-operated
# L2TP/IPsec tunnel (same pattern as mavat-dry-run.yml).
#
# Mode "discover" probes which public Mavat endpoints serve plan document
# metadata through the tunnel; mode "check" (added after discovery proves a
# usable endpoint) fingerprints document sets, downloads changed/new public
# documents, and opens a PR.
#
# The weekly schedule is intentionally NOT active yet. It will be enabled by a
# separate PR only after a green manual run of the check mode, per the repo
# owner's instruction:
#   schedule:
#     - cron: "23 4 * * 1"   # Mondays 04:23 UTC (off-peak, weekly)
#
# Hard rules enforced here and in the scripts: public documents only, no
# login, no CAPTCHA/challenge bypass (any hard challenge or throttling stops
# the run with a visible failure), polite pacing, and no secrets, IPs or
# response bodies in the log (fixed classification fields only).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "discover"
        type: choice
        options:
          - discover
          - check

permissions:
  contents: read

jobs:
  mavat-watch:
    # Kill switch: set repo variable MAVAT_WATCH_ENABLED=false to disable.
    if: ${{ vars.MAVAT_WATCH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install VPN transport packages
        run: |
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y strongswan xl2tpd ppp curl > /dev/null 2>&1

      - name: Bring up owner-operated L2TP/IPsec tunnel
        env:
          VPN_L2TP_SERVER: ${{ secrets.VPN_L2TP_SERVER }}
          VPN_L2TP_PSK: ${{ secrets.VPN_L2TP_PSK }}
          VPN_L2TP_USERNAME: ${{ secrets.VPN_L2TP_USERNAME }}
          VPN_L2TP_PASSWORD: ${{ secrets.VPN_L2TP_PASSWORD }}
        run: sudo --preserve-env=VPN_L2TP_SERVER,VPN_L2TP_PSK,VPN_L2TP_USERNAME,VPN_L2TP_PASSWORD python3 scripts/vpn/l2tp.py up

      - name: Discover reachable public Mavat endpoints
        if: ${{ inputs.mode == 'discover' }}
        run: sudo python3 scripts/vpn/mavat_discover.py

      - name: Install Playwright and Chromium (check mode)
        if: ${{ inputs.mode == 'check' }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
        run: |
          sudo pip install playwright
          sudo -E python3 -m playwright install --with-deps chromium

      - name: Check tracked Mavat plan pages (deadline + fingerprint)
        if: ${{ inputs.mode == 'check' }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
        run: sudo -E python3 scripts/vpn/mavat_check.py

      - name: Publish check results as a PR, merge on green CI
        if: ${{ inputs.mode == 'check' && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet data/mavat_plan_status.json 2>/dev/null || [ ! -f data/mavat_plan_status.json ]; then
            echo "no changes to Mavat status data"
            exit 0
          fi
          BRANCH="mavat-check/$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/mavat_plan_status.json
          git commit -m "Mavat check $(date +%Y-%m-%d) (refs #32)"
          git push -u origin "$BRANCH"
          PR=$(gh pr create --title "Mavat check $(date +%Y-%m-%d)" \
            --body "Automated Mavat check-mode results (refs #32): per-plan deadline text + page fingerprint. Merged automatically once CI is green." \
            --base main --head "$BRANCH")
          gh workflow run ci.yml --ref "$BRANCH"
          sleep 15
          RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$RUN_ID" --exit-status --interval 20
          gh pr merge "$PR" --squash --delete-branch

      - name: Tear down tunnel and remove generated secret material
        if: always()
        run: sudo python3 scripts/vpn/l2tp.py down
